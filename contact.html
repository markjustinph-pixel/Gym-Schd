  <nav class="mobile-tab-bar" aria-label="Primary navigation" data-authenticated-only hidden>

  <main class="container" id="main-content">
    <section id="contact" class="contact-section">
      <h2>Contact Me</h2>
      <form class="contact-form" id="contact-form">
        <div class="form-group">
          <label for="full-name">Full Name:</label>
          <input type="text" id="full-name" name="full-name" minlength="2" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address:</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="topic">Inquiry:</label>
          <select id="topic" name="topic" required>
            <option value="">-- Please choose an option --</option>
            <option value="coaching">Online Coaching</option>
            <option value="promotion">Promotion</option>
            <option value="questions">Random Questions</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">Message:</label>
          <textarea id="message" name="message" rows="4" minlength="10" required></textarea>
        </div>

        <button type="submit" class="btn-submit">Send Message</button>
        <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Mark Justin Melgar
    </p>
    <p><a href="about.html">About This App</a> <a href="contact.html">Contact Me</a></p>
   </footer>
